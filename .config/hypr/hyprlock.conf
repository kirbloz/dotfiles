#source = $HOME/.cache/wal/colors-hyprland.conf

general {
    hide_cursor = true
    immediate_render = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = leizsEase, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, leizsEase
    animation = fadeOut, 1, 4, leizsEase
    animation = inputFieldDots, 1, 2, leizsEase
    animation = inputFieldColors, 1, 3, leizsEase
    animation = inputFieldFade, 1, 3, leizsEase
}

background {
    monitor =
    path = $HOME/Pictures/Wallpapers/longinus.png 
    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_size = 5
    blur_passes = 2 # 0 disables blurring
    noise = 0.0117
    contrast = 0.82000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.3 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = "#b2190c"
    inner_color = "#170d0d"
    font_color = "#f8eadf"
    fade_on_empty = true
    placeholder_text = <i>Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}


# Current time
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = white
    font_size = 128
font_family = Miracode #EVA\-Matisse_Standard
    #font_family = IBM Plex Sans Medium 10
