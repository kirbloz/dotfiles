# theming.conf
#
# Unico punto in cui definire i valori usati per generare i file
# GTK2/3/4 e qt5ct/qt6ct. Modifica questo file, poi rilancia
# setup-theming-configs.sh: non serve toccare lo script.
#
# Sintassi bash valida (KEY="valore"), viene letto con `source`.

# Icon theme (deve esistere in /usr/share/icons, ~/.icons o ~/.local/share/icons)
ICON_THEME="Gruvbox-Plus-Dark"

# Cursor theme (deve esistere in /usr/share/icons, ~/.icons o ~/.local/share/icons)
CURSOR_THEME="Bibata-Modern-Amber"

# Dimensione cursore (da XCURSOR_SIZE/HYPRCURSOR_SIZE nei tuoi env Hyprland)
CURSOR_SIZE=16

# Font UI e relativa dimensione
FONT_NAME="Fira Sans Semibold"
FONT_SIZE=10

# GTK widget theme (nome di un tema in /usr/share/themes o ~/.themes).
# Lascia vuoto ("") se non ne hai uno installato: lo script non scriverà
# la riga gtk-theme-name in nessun file.
GTK_THEME_NAME="gruvbox-dark-gtk"
ADW_DISABLE_PORTAL=1
